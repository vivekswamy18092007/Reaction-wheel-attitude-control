# =============================================================================
# default.yaml — baseline simulation configuration
#
# Copy this file (e.g. `cp default.yaml pd_aggressive.yaml`) to define a new
# experiment. Every field here maps 1:1 onto an argument of an existing class
# constructor in core/ — nothing in this file invents new physics or new
# parameters, it only supplies numbers to code you already wrote and tested.
# =============================================================================

satellite:
  # Principal moments of inertia [kg m^2], CoM-referenced.
  # If you only have diagonal terms, list 3 numbers. If you need the full
  # tensor (off-diagonal coupling), list 9 numbers in row-major order instead
  # — config_loader.py will detect length 3 vs 9 and build the matrix.
  inertia_tensor: [0.014010, 0.041300, 0.002938]

initial:
  # Initial attitude error, specified as roll/pitch/yaw in degrees about the
  # body axes (converted to a quaternion via euler_to_quaternion, then
  # normalized) — NOT raw quaternion components. This keeps the config
  # human-readable ("30 deg about Z") instead of opaque quaternion floats.
  attitude_rpy_deg: [55.0, 65.0, 15.0]

  # Initial body angular velocity [rad/s]
  omega: [0.0, 0.0, 0.0]

target:
  # Target attitude, same convention as initial.attitude_rpy_deg.
  # [0, 0, 0] = identity quaternion (1, 0, 0, 0), i.e. nadir/reference aligned.
  attitude_rpy_deg: [0.0, 0.0, 0.0]

controller:
  type: PD                       # "PD" now; "wie" / "lqr" added later as elif branches
  Kp: [0.006, 0.006, 0.007]      # diagonal entries of the 3x3 Kp matrix
  Kd: [0.025, 0.025, 0.028]      # diagonal entries of the 3x3 Kd matrix

wheels:
  config: pyramid                # "pyramid" (4 wheels) or "orthogonal" (3 wheels)
  tilt_deg: 32.0                 # only used by pyramid config
  wheel_inertia: 2.07e-5         # [kg m^2] per wheel, PLACEHOLDER — swap for CAD/datasheet value
  max_torque: 4.0e-3             # [N m]    PLACEHOLDER motor torque limit
  max_speed: 1570.8              # [rad/s]  ~6000 rpm, PLACEHOLDER

disturbance:
  enabled: False
  # Constant body-frame disturbance torque [N m], applied every step when enabled.
  # Used for Scenario B (disturbance rejection).
  constant_torque: [0,0,0]

sim:
  dt: 0.01                       # [s] RK4 step size
  duration: 60.0                # [s] total simulated time
